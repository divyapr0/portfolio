<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pleurat — Product Designer and AI Systems</title>
    <meta name="description" content="10+ years designing the systems, brands and AI workflows behind products people actually use." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23E69D46'/><text y='.9em' font-size='75' font-weight='bold' x='18' fill='%2316140E'>p</text></svg>" />
    
    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    
    <script>
      (function() {
        try {
          const pref = localStorage.getItem('theme-pref');
          if (pref === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.remove('mode-light');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.add('mode-light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
